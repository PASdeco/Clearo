[project]
name = "clearo"
version = "0.1.0"
description = "Clearo settlement service: invoice, watch and verify agent payments settled through Relay."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
clearo = "clearo.service:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clearo*"]
